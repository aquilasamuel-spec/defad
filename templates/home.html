<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jantar de Casais DEFAD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/imask"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            overflow: hidden; /* Evita rolagem na página inteira */
        }
        .bg-img {
            background-image: url('{{ url_for("static", filename="jantar-de-casais-cell.png") }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        @media (min-width: 768px) {
            .bg-img {
                background-image: url('{{ url_for("static", filename="jantar-de-casais.png") }}');
            }
        }
        
        /* Drawer styling */
        .drawer-form {
            transform: translateX(100%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        .drawer-open .drawer-form {
            transform: translateX(0);
        }
        
        /* Overlay that appears when drawer is open */
        .drawer-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .drawer-open .drawer-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        /* Input styling */
        .clean-input {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            color: #1e293b;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .clean-input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        /* Custom scrollbar for drawer */
        .drawer-form::-webkit-scrollbar {
            width: 8px;
        }
        .drawer-form::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .drawer-form::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-900 h-screen w-screen relative">
    
    <!-- Background Image -->
    <div class="absolute inset-0 z-0 bg-img"></div>
    <!-- Dark gradient overlay for text readability on left side -->
    <div class="absolute inset-0 z-0 bg-gradient-to-r from-black/50 to-transparent"></div>

    <!-- Header / Cabeçalho -->
    <header class="absolute top-0 left-0 w-full p-6 md:p-10 flex justify-end z-20">
        <button onclick="toggleDrawer()" id="btn-header" class="px-8 py-3 bg-white/90 backdrop-blur-md text-indigo-900 text-sm md:text-base font-bold rounded-full shadow-lg hover:bg-white hover:scale-105 hover:shadow-xl transition-all duration-300 ease-in-out">
            INSCREVA-SE
        </button>
    </header>

    <!-- Overlay escura que clica para fechar -->
    <div onclick="toggleDrawer()" class="drawer-overlay absolute inset-0 z-30 bg-black/60 backdrop-blur-sm"></div>

    <!-- Bloco de Inscrição (Drawer) -->
    <div class="drawer-form absolute top-0 right-0 h-full w-full md:w-[32rem] lg:w-[38rem] bg-white z-40 shadow-2xl rounded-l-3xl flex flex-col">
        
        <!-- Drawer Header with Close Button -->
        <div class="flex justify-between items-center p-8 border-b border-gray-100">
            <div>
                <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Crie sua Inscrição</h2>
                <p class="text-sm text-gray-500 mt-1">Preencha os dados do casal abaixo</p>
            </div>
            <button onclick="toggleDrawer()" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Form Content -->
        <div class="p-8 flex-1 overflow-y-auto">
            <form action="/inscrever" method="POST" class="space-y-6">
                
                <!-- Tipo de Inscrição -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Tipo de Inscrição</label>
                    <select id="tipo_inscricao" name="tipo_inscricao" class="w-full px-4 py-3 clean-input rounded-xl text-base font-medium" required onchange="updateForm()">
                        {% for produto in produtos %}
                            <option value="{{ produto.identificador }}" data-valor="{{ produto.valor }}" {% if produto.vagas_disponiveis <= 0 %}disabled{% endif %}>
                                {{ produto.nome }} (R$ {{ "%.2f"|format(produto.valor) }}) {% if produto.vagas_disponiveis <= 0 %} [ESGOTADO] {% endif %}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Nomes -->
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Nome Completo</label>
                        <input type="text" name="nome_completo" required placeholder="Digite o nome completo" class="w-full px-4 py-3 clean-input rounded-xl text-base font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Nome do Cônjuge</label>
                        <input type="text" name="nome_conjuge" required placeholder="Digite o nome do cônjuge" class="w-full px-4 py-3 clean-input rounded-xl text-base font-medium">
                    </div>
                </div>

                <!-- Contato e Data -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">WhatsApp</label>
                        <input type="text" id="telefone" name="telefone" class="w-full px-4 py-3 clean-input rounded-xl text-base font-medium" placeholder="+55 (83) 8888-8888" required>
                        <p class="text-[10px] text-gray-400 mt-1 italic">* Não inclua o 9º dígito (ex: 8888-8888).</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Data de Casamento</label>
                        <input type="date" name="data_casamento" class="w-full px-4 py-3 clean-input rounded-xl text-base font-medium" required>
                    </div>
                </div>

                <!-- Congregação -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Congregação</label>
                    <select name="local_congregacao" required class="w-full px-4 py-3 clean-input rounded-xl text-base font-medium">
                        <option value="Templo Central">Templo Central</option>
                        <option value="Área 1">Área 1</option>
                        <option value="Área 2">Área 2</option>
                        <option value="Área 3">Área 3</option>
                        <option value="Área 4">Área 4</option>
                        <option value="Área 5">Área 5</option>
                        <option value="Área 6">Área 6</option>
                        <option value="Área 7">Área 7</option>
                        <option value="Campo">Campo</option>
                        <option value="Outra Denominação">Outra Denominação</option>
                        <option value="Não Evangélico">Não Evangélico</option>
                    </select>
                </div>

                <!-- CPF Condicional -->
                <div id="cpf_container" class="hidden bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">CPF do Responsável <span class="text-orange-600">*Obrigatório para Hotel</span></label>
                    <input type="text" id="cpf_responsavel" name="cpf_responsavel" placeholder="000.000.000-00" class="w-full px-4 py-3 clean-input rounded-xl text-base font-medium">
                </div>

                <div class="h-px bg-gray-200 w-full my-6"></div>
                
                <!-- Pagamento -->
                <h3 class="text-xl font-bold text-gray-900">Pagamento</h3>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mt-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Parcelamento</label>
                        <select id="parcelas" name="parcelas" class="w-full px-4 py-3 clean-input rounded-xl text-base font-medium" onchange="updateValorParcela()">
                            {% for m in meses_disponiveis %}
                                <option value="{{ m }}">{{ m }}x</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Dia Vencimento</label>
                        <select name="dia_vencimento" class="w-full px-4 py-3 clean-input rounded-xl text-base font-medium">
                            <option value="5">Dia 05</option>
                            <option value="10">Dia 10</option>
                            <option value="15">Dia 15</option>
                            <option value="20">Dia 20</option>
                        </select>
                    </div>
                </div>

                <!-- Resumo -->
                <div class="bg-orange-500/10 border border-orange-500/20 rounded-xl p-5 mt-4 text-center">
                    <p class="text-xs font-semibold uppercase tracking-wider bg-gradient-to-r from-orange-500 to-red-600 bg-clip-text text-transparent">Resumo do Pagamento</p>
                    <p class="text-2xl font-extrabold mt-1 bg-gradient-to-r from-orange-500 to-red-600 bg-clip-text text-transparent" id="resumo_pagamento">1x de R$ 250,00</p>
                </div>

                <!-- Submit Button -->
                <div class="pt-6 pb-8">
                    <button type="submit" class="w-full flex justify-center py-4 px-4 border border-transparent text-lg font-bold rounded-xl text-white bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 hover:to-red-700 shadow-lg shadow-orange-500/40 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 transform transition-all duration-200 hover:-translate-y-0.5">
                        Finalizar Inscrição
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Toggle Drawer
        function toggleDrawer() {
            document.body.classList.toggle('drawer-open');
            const btn = document.getElementById('btn-header');
            if (document.body.classList.contains('drawer-open')) {
                btn.style.opacity = '0';
                btn.style.pointerEvents = 'none';
            } else {
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            }
        }

        // Máscaras
        document.addEventListener('DOMContentLoaded', function() {
            const phoneInput = document.getElementById('telefone');
            IMask(phoneInput, {
                mask: '+55 (00) 0000-0000'
            });
            IMask(document.getElementById('cpf_responsavel'), {
                mask: '000.000.000-00'
            });
        });

        function updateForm() {
            const tipo = document.getElementById('tipo_inscricao').value;
            const cpfContainer = document.getElementById('cpf_container');
            const cpfInput = document.getElementById('cpf_responsavel');

            if (tipo === 'jantar_hotel') {
                cpfContainer.classList.remove('hidden');
                cpfInput.setAttribute('required', 'required');
            } else {
                cpfContainer.classList.add('hidden');
                cpfInput.removeAttribute('required');
                cpfInput.value = '';
            }
            updateValorParcela();
        }

        function updateValorParcela() {
            const selectTipo = document.getElementById('tipo_inscricao');
            const valorTotal = parseFloat(selectTipo.options[selectTipo.selectedIndex].getAttribute('data-valor'));
            const qtdParcelas = parseInt(document.getElementById('parcelas').value);
            
            const valorParcela = (valorTotal / qtdParcelas).toFixed(2).replace('.', ',');
            
            document.getElementById('resumo_pagamento').innerText = `${qtdParcelas}x de R$ ${valorParcela} (Total: R$ ${valorTotal.toFixed(2).replace('.', ',')})`;
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            updateForm();
            // Optional: open drawer automatically if there's an error param in URL, etc.
        });
    </script>
</body>
</html>
